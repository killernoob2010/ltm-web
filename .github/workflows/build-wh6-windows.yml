name: Build WH6 Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - codex/wh6-option-fill-collector-brd-20260902

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          "WH6_ISCC_PATH=C:\Program Files (x86)\Inno Setup 6\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and verify installer
        shell: pwsh
        run: .\collector\installer\build_windows.ps1 -SkipDependencyInstall -NoPause

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: WH6成交采集器-windows-x64
          path: |
            collector/releases/WH6成交采集器-Setup.exe
            collector/releases/WH6成交采集器-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 7

name: Build WH6 Windows portable executable

on:
  workflow_dispatch:
  push:
    branches:
      - staging

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and verify portable executable
        shell: pwsh
        run: .\collector\installer\build_windows.ps1 -SkipDependencyInstall -NoPause

      - name: Upload portable executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: WH6成交采集器-0.3.2-windows-x64
          path: |
            collector/releases/0.3.2/WH6成交采集器-0.3.2.exe
            collector/releases/0.3.2/WH6成交采集器-0.3.2.exe.sha256
            collector/releases/0.3.2/README-0.3.2.txt
          if-no-files-found: error
          retention-days: 7
